name: Validate submission
on: [push, pull_request, workflow_dispatch]
env:
  TEAM_NAME: los-bocatones
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/conformance.py --json results/ci-conformance.json --workdir results
      - run: docker build -t swarm-agent:test agent-template
      - run: python tests/conformance.py --image swarm-agent:test --json results/ci-docker.json --workdir results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: results/
